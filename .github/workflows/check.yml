name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # v7.0.1. Pinned to a commit because tags can be moved (DEP-14).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test the checker
        run: python3 -m unittest discover -s build-tools
      - name: Check the standards
        run: python3 build-tools/check_standards.py
